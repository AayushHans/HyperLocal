services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
      - REACT_APP_SOCKET_URL=http://localhost:5001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

  backend:
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:3000

  db:
    ports:
      - "5432:5432"
